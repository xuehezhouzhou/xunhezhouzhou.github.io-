<h1>🎵 舟舟的拇指琴首演</h1>
<p>演奏者：舟舟 | 曲目：小星星 | 指导：阿寻</p>

<h2>展品介绍</h2>
<p>这首《小星星》，是舟舟从印尼回来后的第一个周末录制的。拇指琴是她从雅加达机场买回来的，只有七个按键。她练了整整一周，从第一行到第六行，终于能完整弹奏。</p>
