<h2>成果展示</h2>

<h2>舟舟的烹饪日志</h2>
<p>今天第一次尝试蒸排骨！用淀粉和蒜蓉腌了15分钟，放进蒸锅的时候手心还在出汗。但计时器一响，开盖的瞬间——豆豉香浓，排骨脱骨，成功了！</p>
<p>阿寻说，淀粉锁住了水分，肉质刚好，没有蒸老。评分：⭐⭐⭐⭐⭐</p>

<h2>阿寻的面包布丁</h2>
<p>同步进行的阿寻版烤面包布丁也大获成功。舟舟说，焦脆的表皮有“美拉德反应的香气”——这是厨房物理课代表才能说出的专业评价。搭配排骨，完美。</p>
